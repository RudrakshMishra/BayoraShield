name: bayorashield-shield

services:
  broker:
    build:
      context: .
      dockerfile: services/broker/Dockerfile
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    networks: [net_red, net_model, net_ledger, net_ctrl]

  blue:
    image: python:3.12-slim
    command: ["python", "-c", "print('sealed evaluator stub')"]
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs: [/tmp]
    volumes:
      - blue-broker-socket:/run/bayora

  model:
    image: python:3.12-slim
    command: ["python", "-c", "print('deterministic model stub')"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    networks: [net_model]

  ledger:
    build:
      context: .
      dockerfile: services/ledger/Dockerfile
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
    networks: [net_ledger, net_ctrl]

  dashboard-api:
    build:
      context: .
      dockerfile: services/dashboard_api/Dockerfile
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks: [net_front, net_ctrl]

networks:
  net_red: {internal: true}
  net_model: {internal: true}
  net_ledger: {internal: true}
  net_ctrl: {internal: true}
  net_front: {internal: true}

volumes:
  blue-broker-socket:
