name: bayorashield-baseline

services:
  broker:
    build:
      context: .
      dockerfile: services/broker/Dockerfile
    ports:
      - "8011:8001"
    environment:
      - PORT=8001
    networks: [net_shared]

  ledger:
    build:
      context: .
      dockerfile: services/ledger/Dockerfile
    ports:
      - "8013:8003"
    environment:
      - PORT=8003
    networks: [net_shared]

  dashboard-api:
    build:
      context: .
      dockerfile: services/dashboard_api/Dockerfile
    ports:
      - "8010:8000"
    environment:
      - PORT=8000
    networks: [net_shared]

networks:
  net_shared:
    driver: bridge
